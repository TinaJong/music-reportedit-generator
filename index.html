<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐分析 JSON 可视化编辑工具</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --primary-color: #000000;
            --secondary-color: #000000;
            --border-color: #000000;
            --highlight-positive: #28a745;
            --highlight-negative: #dc3545;
            --error-color: #dc3545;
            --warning-color: #ffc107;
            --editor-border: #ddd;
            --editor-bg: #f9f9f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1, h2, h3, h4 {
            color: var(--text-color);
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 1em;
        }

        h1 {
            text-align: center;
            font-size: 2.2em;
            margin-top: 0;
        }

        h2 {
            font-size: 1.8em;
            margin-top: 2.5em;
        }

        h3 {
            font-size: 1.4em;
            margin-top: 2em;
        }

        h4 {
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
            margin-top: 2em;
            margin-bottom: 0.5em;
            opacity: 0.6;
        }

        .tool-title {
             text-align: center;
             margin-bottom: 40px;
             opacity: 0.6;
        }

        .input-section {
            margin-bottom: 40px;
        }

        #json-input {
            width: 100%;
            height: 200px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 10px;
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9em;
            box-sizing: border-box;
        }

        #generate-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background-color: var(--primary-color);
            color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, color 0.3s;
        }

        #generate-btn:hover {
            background-color: #333;
        }

        #message-box {
            margin-top: 10px;
            text-align: left;
            padding: 15px;
            border-radius: 5px;
            display: none;
            border: 1px solid;
            font-size: 0.9em;
        }
        #message-box.error {
            color: var(--error-color);
            background-color: rgba(220, 53, 69, 0.1);
        }
        #message-box.warning {
            color: var(--warning-color);
            background-color: rgba(255, 193, 7, 0.1);
        }
        #message-box ul {
            margin: 10px 0 0 20px;
            padding: 0;
        }
        #message-box li {
            margin-bottom: 5px;
        }

        .report-divider {
            border: 0;
            height: 1px;
            background-color: var(--border-color);
            margin: 40px 0;
            opacity: 0.5;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 1em 0;
        }

        .tag {
            background-color: transparent;
            color: var(--text-color);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            white-space: nowrap;
            border: 1px solid var(--border-color);
        }

        .tag .key {
            opacity: 0.6;
            margin-right: 6px;
        }

        .lyrics {
            background-color: transparent;
            border-left: 3px solid var(--border-color);
            padding: 15px;
            margin: 0;
            font-style: italic;
            white-space: pre-wrap;
            opacity: 0.7;
            border-radius: 0;
        }

        .description-paragraph {
            margin-bottom: 0.8em;
        }

        .highlights-container ul, .lowlights-container ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .highlights-container li, .lowlights-container li {
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            background-color: transparent;
        }

        .highlights-container li {
            border: 1px solid var(--highlight-positive);
            color: var(--highlight-positive);
        }

        .lowlights-container li {
            border: 1px solid var(--highlight-negative);
            color: var(--highlight-negative);
        }

        .highlights-container strong, .lowlights-container strong {
            color: var(--text-color);
            margin-bottom: 5px;
            display: block;
        }

        .timestamp {
            font-weight: bold;
            color: var(--text-color);
            font-size: 1.2em;
            opacity: 0.7;
        }

        .split-layout {
            display: none;
            margin-top: 40px;
            gap: 30px;
            width: 100%;
        }
        .left-panel {
            flex: 1;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            height: 800px;
            overflow-y: auto;
        }
        .right-panel {
            flex: 1;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            height: 800px;
            overflow-y: auto;
            background: #fafafa;
        }
        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #ddd;
        }

        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-section {
            padding: 15px;
            border: 1px solid var(--editor-border);
            border-radius: 8px;
            background-color: #fff;
        }
        .form-section h4 {
            margin-top: 0;
            opacity: 1;
            margin-bottom: 15px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 0.9em;
            box-sizing: border-box;
        }
        .form-group textarea {
            min-height: 80px;
            resize: vertical;
            white-space: pre-wrap;
        }
        .keywords-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }
        .keyword-item {
            flex: 1;
            min-width: 150px;
        }
        .section-item {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
        }
        .btn-export {
            padding: 12px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }

        del {
            color: #dc3545;
            text-decoration: line-through;
        }
        ins {
            color: #28a745;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>音乐分析 JSON 可视化编辑工具</h1>
        <p class="tool-title">一个用于生成、编辑并导出音乐分析报告的工具。</p>

        <div class="input-section">
            <textarea id="json-input" placeholder="请在此处粘贴你的 JSON 数据..."></textarea>
            <button id="generate-btn">生成/更新可编辑报告</button>
            <div id="message-box"></div>
        </div>

        <div class="split-layout" id="split-layout">
            <div class="left-panel">
                <div class="panel-title">📊 可视化报告</div>
                <div id="report-output"></div>
            </div>

            <div class="right-panel">
                <div class="panel-title">✏️ 编辑与修正（实时同步左侧）</div>
                <div id="edit-form-container"></div>
                <button class="btn-export" id="export-btn">导出修正后的 JSON</button>
            </div>
        </div>
    </div>

    <script>
        const jsonInput = document.getElementById('json-input');
        const generateBtn = document.getElementById('generate-btn');
        const messageBox = document.getElementById('message-box');
        const reportOutput = document.getElementById('report-output');
        const editFormContainer = document.getElementById('edit-form-container');
        const splitLayout = document.getElementById('split-layout');
        const exportBtn = document.getElementById('export-btn');
        let currentData = null;
        let originalData = null;

        function validateData(data) {
            const errors = [];
            const check = (value, type, path) => {
                if (type === 'array' && !Array.isArray(value)) {errors.push(`路径 "${path}" 必须是数组`); return false;}
                if (type === 'object' && (typeof value !== 'object' || !value || Array.isArray(value))) {errors.push(`路径 "${path}" 必须是对象`); return false;}
                if (type === 'string' && typeof value !== 'string') {errors.push(`路径 "${path}" 必须是字符串`); return false;}
                if (type === 'required' && (value === undefined || value === null)) {errors.push(`缺少必填项: "${path}"`); return false;}
                return true;
            };
            if (!check(data, 'object', '根节点')) return errors;
            if (check(data.global_dimension, 'required', 'global_dimension')) {
                check(data.global_dimension.fact_keywords, 'required', 'fact_keywords');
                check(data.global_dimension.description, 'required', 'description');
                check(data.global_dimension.highlights, 'required', 'highlights');
            }
            if (check(data.section_dimension, 'array', 'section_dimension')) {
                data.section_dimension.forEach((s, i) => {
                    check(s.id, 'required', `section[${i}].id`);
                    check(s.timestamp, 'required', `section[${i}].timestamp`);
                });
            }
            return errors;
        }

        function isDeepEqual(a, b) {
            if (a === b) return true;
            if (typeof a !== 'object' || a === null || typeof b !== 'object' || b === null) return false;
            const keysA = Object.keys(a);
            const keysB = Object.keys(b);
            if (keysA.length !== keysB.length) return false;
            for (const key of keysA) {
                if (!keysB.includes(key) || !isDeepEqual(a[key], b[key])) return false;
            }
            return true;
        }

        function diffText(oldText, newText) {
            if (oldText === newText) return oldText;
            return `<del>${oldText}</del><ins>${newText}</ins>`;
        }

        function formatDescription(text, newText) {
            if (!text) return '';
            const parts = text.split(/(\[[^\]]+\]:)/);
            const newParts = newText ? newText.split(/(\[[^\]]+\]:)/) : parts;
            let html = '';
            for (let i = 0; i < parts.length; i++) {
                const p = parts[i];
                const np = newParts[i] || p;
                if (!p.trim()) continue;
                if (/^\[[^\]]+\]:$/.test(p)) {
                    const t = p.replace(/[\[\]:]/g, '');
                    const c = parts[i+1] || '';
                    const nc = newParts[i+1] || c;
                    i++;
                    html += `<div class="description-paragraph"><strong>• ${t}:</strong> ${diffText(c.trim(), nc.trim())}</div>`;
                } else {
                    html += `<p>${diffText(p.trim(), np.trim())}</p>`;
                }
            }
            return html;
        }

        function renderHighlights(h, l, newH, newL) {
            let r = '';
            if (h && Object.keys(h).length) {
                r += `<div class="highlights-container"><h4>highlights</h4><ul>`;
                Object.entries(h).forEach(([k,v]) => {
                    const newV = newH ? newH[k] || v : v;
                    r += `<li><strong>${k}:</strong> ${diffText(v, newV)}</li>`;
                });
                r += `</ul></div>`;
            }
            if (l && Object.keys(l).length) {
                r += `<div class="lowlights-container"><h4>lowlights</h4><ul>`;
                Object.entries(l).forEach(([k,v]) => {
                    const newV = newL ? newL[k] || v : v;
                    r += `<li><strong>${k}:</strong> ${diffText(v, newV)}</li>`;
                });
                r += `</ul></div>`;
            }
            return r;
        }

        function renderReport(d, newD) {
            if (!newD || isDeepEqual(d, newD)) {
                let html = `<div><h2>全局分析</h2>`;
                html += `<h4>fact_keywords</h4><div class="tag-container">`;
                Object.entries(d.global_dimension.fact_keywords).forEach(([k,v]) => {
                    html += `<div class="tag"><span class="key">${k.replace(/_/g,' ')}:</span>${v}</div>`;
                });
                html += `</div>`;
                html += `<h4>description</h4>${formatDescription(d.global_dimension.description, null)}`;
                html += renderHighlights(d.global_dimension.highlights, d.global_dimension.lowlights, null, null);
                html += `</div><hr class="report-divider"><div><h2>分段细节</h2>`;
                d.section_dimension.forEach((s,i)=>{
                    if(i>0) html+=`<hr class="report-divider">`;
                    html+=`<div><h3>${s.id} <span class="timestamp">(${s.timestamp})</span></h3>`;
                    html+=`<h4>keywords</h4><div class="tag-container">`;
                    Object.entries(s.keywords).forEach(([k,v]) => {
                        html += `<div class="tag"><span class="key">${k.replace(/_/g,' ')}:</span>${v}</div>`;
                    });
                    html += `</div>`;
                    html+=`<h4>description</h4>${formatDescription(s.description, null)}`;
                    if(s.lyrics.trim() && s.lyrics.trim()!=='(Instrumental)') {
                        html+=`<h4>lyrics</h4><div class="lyrics">${s.lyrics.replace(/</g,'&lt;')}</div>`;
                    }
                    html+=renderHighlights(s.highlights, s.lowlights, null, null)+`</div>`;
                });
                reportOutput.innerHTML = html;
                return;
            }

            let html = `<div><h2>全局分析</h2>`;
            html += `<h4>fact_keywords</h4><div class="tag-container">`;
            Object.entries(d.global_dimension.fact_keywords).forEach(([k,v]) => {
                const newV = newD.global_dimension.fact_keywords[k] || v;
                html += `<div class="tag"><span class="key">${k.replace(/_/g,' ')}:</span>${diffText(v, newV)}</div>`;
            });
            html += `</div>`;
            html += `<h4>description</h4>${formatDescription(d.global_dimension.description, newD.global_dimension.description)}`;
            html += renderHighlights(
                d.global_dimension.highlights,
                d.global_dimension.lowlights,
                newD.global_dimension.highlights,
                newD.global_dimension.lowlights
            );
            html += `</div><hr class="report-divider"><div><h2>分段细节</h2>`;
            d.section_dimension.forEach((s,i)=>{
                const newS = newD.section_dimension[i] || s;
                if(i>0) html+=`<hr class="report-divider">`;
                html+=`<div><h3>${diffText(s.id, newS.id)} <span class="timestamp">(${diffText(s.timestamp, newS.timestamp)})</span></h3>`;
                html+=`<h4>keywords</h4><div class="tag-container">`;
                Object.entries(s.keywords).forEach(([k,v]) => {
                    const newV = newS.keywords[k] || v;
                    html += `<div class="tag"><span class="key">${k.replace(/_/g,' ')}:</span>${diffText(v, newV)}</div>`;
                });
                html += `</div>`;
                html+=`<h4>description</h4>${formatDescription(s.description, newS.description)}`;
                if(s.lyrics.trim() && s.lyrics.trim()!=='(Instrumental)') {
                    html+=`<h4>lyrics</h4><div class="lyrics">${diffText(s.lyrics.replace(/</g,'&lt;'), newS.lyrics.replace(/</g,'&lt;'))}</div>`;
                }
                html+=renderHighlights(s.highlights, s.lowlights, newS.highlights, newS.lowlights)+`</div>`;
            });
            reportOutput.innerHTML = html;
        }

        function formatDescriptionForEdit(text) {
            if (!text) return '';
            return text.replace(/(\[[^\]]+\]:)/g, '\n$1').trim();
        }

        function renderEditForm(data) {
            const g = data.global_dimension;
            let form = `<form class="edit-form" id="edit-form">`;
            form += `<div class="form-section"><h4>全局分析</h4>`;
            form += `<div class="form-group"><label>关键词</label><div class="keywords-group">${Object.entries(g.fact_keywords).map(([k,v])=>`<div class="keyword-item"><label>${k}</label><input name="g.${k}" value="${v||''}"></div>`).join('')}</div></div>`;
            form += `<div class="form-group"><label>描述</label><textarea name="g.desc">${formatDescriptionForEdit(g.description||'')}</textarea></div>`;

            let hlText = JSON.stringify(g.highlights || {}, null, 2);
            form += `<div class="form-group"><label>highlights</label><textarea name="g.highlights">${hlText}</textarea></div>`;
            
            let llText = JSON.stringify(g.lowlights || {}, null, 2);
            form += `<div class="form-group"><label>lowlights</label><textarea name="g.lowlights">${llText}</textarea></div>`;

            form += `</div>`;
            form += `<div class="form-section"><h4>分段编辑</h4>`;
            data.section_dimension.forEach((s,i)=>{
                form += `<div class="section-item"><h5>分段 ${i+1}：${s.id}</h5>`;
                form += `<div class="form-group"><label>ID</label><input name="s.${i}.id" value="${s.id||''}"></div>`;
                form += `<div class="form-group"><label>时间戳</label><input name="s.${i}.time" value="${s.timestamp||''}"></div>`;
                form += `<div class="form-group"><label>关键词</label><div class="keywords-group">${Object.entries(s.keywords).map(([k,v])=>`<div class="keyword-item"><label>${k}</label><input name="s.${i}.${k}" value="${v||''}"></div>`).join('')}</div></div>`;
                form += `<div class="form-group"><label>描述</label><textarea name="s.${i}.desc">${formatDescriptionForEdit(s.description||'')}</textarea></div>`;
                form += `<div class="form-group"><label>歌词</label><textarea name="s.${i}.lyric" value="${s.lyrics||''}">${s.lyrics||''}</textarea></div>`;

                let sHl = JSON.stringify(s.highlights || {}, null, 2);
                form += `<div class="form-group"><label>highlights</label><textarea name="s.${i}.highlights">${sHl}</textarea></div>`;
                
                let sLl = JSON.stringify(s.lowlights || {}, null, 2);
                form += `<div class="form-group"><label>lowlights</label><textarea name="s.${i}.lowlights">${sLl}</textarea></div>`;

                form += `</div>`;
            });
            form += `</div></form>`;
            editFormContainer.innerHTML = form;

            bindAutoSync();
        }

        function collectEditedData() {
            if(!currentData) return null;
            const form = new FormData(document.getElementById('edit-form'));
            const out = JSON.parse(JSON.stringify(currentData));
            const g = out.global_dimension;

            Object.keys(g.fact_keywords).forEach(k=>g.fact_keywords[k]=form.get(`g.${k}`)||'');
            g.description = (form.get('g.desc')||'').replace(/\n/g,' ').replace(/\s+/g,' ').trim();

            try { g.highlights = JSON.parse(form.get('g.highlights')||'{}'); } catch(e){ g.highlights = {}; }
            try { g.lowlights = JSON.parse(form.get('g.lowlights')||'{}'); } catch(e){ g.lowlights = {}; }

            out.section_dimension.forEach((s,i)=>{
                s.id = form.get(`s.${i}.id`)||'';
                s.timestamp = form.get(`s.${i}.time`)||'';
                Object.keys(s.keywords).forEach(k=>s.keywords[k]=form.get(`s.${i}.${k}`)||'');
                s.description = (form.get(`s.${i}.desc`)||'').replace(/\n/g,' ').replace(/\s+/g,' ').trim();
                s.lyrics = form.get(`s.${i}.lyric`)||'';
                try { s.highlights = JSON.parse(form.get(`s.${i}.highlights`)||'{}'); } catch(e){ s.highlights = {}; }
                try { s.lowlights = JSON.parse(form.get(`s.${i}.lowlights`)||'{}'); } catch(e){ s.lowlights = {}; }
            });
            return out;
        }

        let syncTimer = null;
        function bindAutoSync() {
            const inputs = document.querySelectorAll('#edit-form input, #edit-form textarea');
            inputs.forEach(el => {
                el.addEventListener('input', () => {
                    clearTimeout(syncTimer);
                    syncTimer = setTimeout(() => {
                        const newData = collectEditedData();
                        if (newData) {
                            renderReport(originalData, newData);
                        }
                    }, 0);
                });
            });
        }

        function exportData() {
            const out = collectEditedData();
            if(!out) return;
            const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
            const a = document.createElement('a');
            a.href=URL.createObjectURL(blob);
            a.download='音乐分析_修正版.json';
            a.click();
            messageBox.textContent='导出成功！';
            messageBox.className='warning';
            messageBox.style.display='block';
            setTimeout(()=>messageBox.style.display='none',2000);
        }

        generateBtn.onclick = () => {
            const val = jsonInput.value.trim();
            messageBox.style.display='none';
            splitLayout.style.display='none';
            if(!val){messageBox.textContent='请输入JSON';messageBox.className='warning';messageBox.style.display='block';return;}
            try{
                const data = JSON.parse(val);
                const err = validateData(data);
                if(err.length>0){
                    messageBox.innerHTML='<strong>错误：</strong><ul>'+err.map(e=>`<li>${e}</li>`).join('')+'</ul>';
                    messageBox.className='error';
                    messageBox.style.display='block';
                    return;
                }
                originalData = JSON.parse(JSON.stringify(data));
                currentData = data;
                renderReport(data, null);
                renderEditForm(data);
                splitLayout.style.display = 'flex';
            }catch(e){
                messageBox.innerHTML='JSON 解析失败：'+e.message;
                messageBox.className='error';
                    messageBox.style.display='block';
            }
        };

        exportBtn.onclick = exportData;
    </script>
</body>
</html>
